<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img" aria-labelledby="title desc">
  <title id="title">A simplex is active northeast of its grade</title>
  <desc id="desc">The horizontal axis is Rips scale and the vertical axis is function level. A simplex with grade p is active when both coordinates reach or exceed p. Grades A and B are incomparable because A has smaller scale but larger level than B.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/></marker></defs>
  <rect width="680" height="320" rx="12" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" font-size="16" fill="#1f2937">
    <rect x="295" y="40" width="315" height="105" fill="#dbeafe"/>
    <text x="352" y="79" fill="#1e40af">Simplex is active here</text>
    <text x="352" y="104" font-size="14" fill="#1e40af">both thresholds ≥ its grade</text>
    <path d="M 80 245 H 625 M 80 245 V 27" fill="none" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 295 245 V 145 H 80" fill="none" stroke="#64748b" stroke-dasharray="5 5"/>
    <circle cx="295" cy="145" r="6" fill="#2563eb"/>
    <text x="308" y="162" fill="#1e40af">p = simplex grade</text>
    <circle cx="200" cy="78" r="6" fill="#b45309"/>
    <text x="212" y="74" fill="#92400e">A</text>
    <circle cx="450" cy="208" r="6" fill="#b45309"/>
    <text x="462" y="212" fill="#92400e">B</text>
    <text x="470" y="274">Rips scale r →</text>
    <text x="22" y="201" transform="rotate(-90 22 201)">Function level a →</text>
    <text x="80" y="302" font-size="15">A and B are incomparable: one coordinate increases, the other decreases.</text>
  </g>
</svg>
