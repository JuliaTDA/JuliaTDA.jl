name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Cancel in-progress runs of the same workflow on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'     # minimum supported
          - '1'        # latest stable 1.x
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Resolve public ecosystem sources in this checkout
        run: julia --startup-file=no scripts/setup.jl
      - uses: julia-actions/julia-buildpkg@v1
      - name: Test bundled multiparameter package
        run: julia --project=. -e 'using Pkg; Pkg.test("MultiparameterPersistence")'
      - uses: julia-actions/julia-runtest@v1
      - name: Leakage-safe MLJ tuning example
        run: |
          julia --project=. -e 'using Pkg; Pkg.add(["MLJ", "MLJDecisionTreeInterface", "CairoMakie"])'
          julia --project=. examples/tuned_ph_pipeline.jl
      - name: Cross-package smoke pipelines, including rendered figures
        run: julia --startup-file=no --project=. scripts/smoke.jl
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
